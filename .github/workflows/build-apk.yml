name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip wget autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            libltdl-dev ccache patchelf python3-dev

      - name: Install Buildozer
        run: |
          # pip 26.3+ 移除了 pip._internal.utils.logging.capture_logging，
          # 会破坏 python-for-android 的构建脚本；锁定到 26.3 之前作双保险。
          python -m pip install --upgrade "pip<26.3" setuptools wheel
          python -m pip install buildozer

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardtask-apk
          path: bin/*.apk
          if-no-files-found: error
